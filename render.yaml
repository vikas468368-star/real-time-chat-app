services:
  - type: web
    name: pulsechat
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pulsechat-db
          property: connectionString
      - key: SOCKETIO_ALLOWED_ORIGINS
        sync: false

databases:
  - name: pulsechat-db
    plan: free